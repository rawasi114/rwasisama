name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: rawasi
          POSTGRES_PASSWORD: rawasi
          POSTGRES_DB: rawasi_erp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U rawasi"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    env:
      DATABASE_URL: postgresql://rawasi:rawasi@localhost:5432/rawasi_erp_test?schema=public
      REDIS_URL: redis://localhost:6379
      JWT_ACCESS_SECRET: ci-access-secret-min-32-chars-xxxxxxxx
      JWT_REFRESH_SECRET: ci-refresh-secret-min-32-chars-xxxxxxx
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from the "packageManager" field in package.json.
      # Do NOT also set a "version" input here — action-setup@v4 errors when both
      # are present ("Multiple versions of pnpm specified").
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm --filter @rawasi/api db:generate

      - name: Apply migrations
        run: pnpm --filter @rawasi/api db:deploy

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      - name: Test
        run: pnpm test
